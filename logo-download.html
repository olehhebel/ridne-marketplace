<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIDNE logo export</title><style>body{margin:0;background:#000;color:#fff;font:16px system-ui;display:grid;min-height:100vh;place-items:center}.wrap{text-align:center}.logo{width:300px;height:300px;display:block;margin:0 auto 24px}button{font:inherit;padding:14px 20px;border:0;border-radius:12px;cursor:pointer}</style></head><body><div class="wrap"><img class="logo" src="/assets/ridne-logo.svg" alt="РІДНЕ"><button id="download">Download RIDNE LinkedIn JPG</button></div><canvas id="c" width="300" height="300" hidden></canvas><script>const b=document.getElementById('download'),c=document.getElementById('c'),x=c.getContext('2d');b.onclick=()=>{const i=new Image();i.onload=()=>{x.fillStyle='#000';x.fillRect(0,0,300,300);x.drawImage(i,0,0,300,300);c.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ridne-linkedin.jpg';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},'image/jpeg',.92)};i.src='/assets/ridne-logo.svg?export=1'};</script></body></html>
